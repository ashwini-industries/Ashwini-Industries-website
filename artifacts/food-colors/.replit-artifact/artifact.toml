kind = "web"
previewPath = "/"
title = "Food Color Exporter"
version = "1.0.0"
id = "artifacts/food-colors"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22440

[services.development]
run = "pnpm --filter @workspace/food-colors run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/food-colors", "run", "build" ]
publicDir = "artifacts/food-colors/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22440"
BASE_PATH = "/"
